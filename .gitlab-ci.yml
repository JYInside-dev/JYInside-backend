stages:
  - build

build_backend:
  stage: build
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      command: ["--mtu=1400"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  tags:
    - saas-linux-small-arm64
  script:
    - docker build --pull -t backend-image .