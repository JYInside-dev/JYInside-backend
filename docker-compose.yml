services:
  redis:
    image: redis:7.4.8-alpine3.21

    # Redis의 페이지 교체 알고리즘을 LRU로 설정 번역본을 저장할때에는 LRU가 좋을거같음.
    # Redis AOF를 활용하여 스냅샷보다 데이터 유실 방지
    command: redis-server  --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBIT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBIT_PASSWORD}
    volumes:
      - rabbit_data:/var/lib/rabbitmq # 큐에 쌓인 메시지 보존용 볼륨


volumes:
  redis_data:
  rabbit_data:


