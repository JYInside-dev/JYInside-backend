spring:
  application:
    name: community-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_db
    username: najeungyoon
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Table 없으면 자동생성, 있으면 update
      ddl-auto: update
      # JPA Entity의 카멜케이스를 DB의 Column으로는 스네이크케이스로 변환.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true




server:
  port: 8080
