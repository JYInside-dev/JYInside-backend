spring:
  application:
    name: community-backend
    config:
      import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # docker compose에서 db 변수 소스를 주지 않았을 때 로컬로 실행해보기 위해서
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

  jpa:
    hibernate:
      # Table 없으면 자동생성, 있으면 update
      ddl-auto: update
      # JPA Entity의 카멜케이스를 DB의 Column으로는 스네이크케이스로 변환.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  management:
    endpoints:
      web:
        exposure:
          include: health, info
    endpoint:
      health:
        show-details: always


  # kafka 설정
  kafka:
    consumer:
      # 우리가 도커 호스트(로컬) 9092번 포트로 열어둔 카프카 주소
      bootstrap-servers: kafka:9092

      # 컨슈머 그룹 ID (이름은 원하는 대로 지어도 되지만 필수로 있어야 해!)
      group-id: community-ranking-group

      # 만약 서버가 꺼져있던 동안 쌓인 데이터가 있다면, 처음부터(earliest) 다 읽어오라는 뜻
      auto-offset-reset: earliest

      # 카프카에서 날아오는 바이트 데이터를 우리가 읽을 수 있는 문자열(String)로 변환
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  
  # redis 설정
  data:
    redis:
      port: 6379
      host: localhost




jwt:
  secret: this-is-a-very-long-jwt-secret-key-for-local-development-1234567890
  access-token-expiration: 1800000


oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://sku-community.duckdns.org:8000/api/oauth/google/callback}

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI:http://sku-community.duckdns.org:8000/api/oauth/naver/callback}

  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://sku-community.duckdns.org:8000/api/oauth/kakao/callback}


app:
  frontend-base-url:
    ${FRONTEND_BASE_URL:http://sku-community.duckdns.org:8000}




server:
  port: 8080



