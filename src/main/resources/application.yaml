spring:
  application:
    name: community-backend
    config:
      import: optional:file:.env[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # docker compose에서 db 변수 소스를 주지 않았을 때 로컬로 실행해보기 위해서
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

  jpa:
    hibernate:
      # Table 없으면 자동생성, 있으면 update
      ddl-auto: update
      # JPA Entity의 카멜케이스를 DB의 Column으로는 스네이크케이스로 변환.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

server:
  port: 8080
